[package]
name = "orchestrat-dashboard"
version = "0.1.0"
description = "Orchestrat macOS dashboard"
authors = ["Arman Ghevondyan"]
license = "Elastic-2.0"
repository = "https://github.com/armanghev/orchestrat"
edition = "2021"
rust-version = "1.88"

[lib]
name = "orchestrat_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15.7"
tauri-build = { version = "2.6.3", features = [] }
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = "=4.18.0"
objc2-app-kit = { version = "0.3.2", features = ["NSScreen", "NSWindow"] }
objc2-core-foundation = "0.3.2"

[dependencies]
async-trait = "0.1.89"
base64 = "0.23.1"
keyring = "4.1.6"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
tauri-plugin-store = "2.4.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9.12"
url = "2.5.8"

[dev-dependencies]
httpmock = "0.8.3"
