services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ./private-alpha.env
    environment:
      ORCHESTRAT_API_HOST: 0.0.0.0
      ORCHESTRAT_API_PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped
    deploy:
      replicas: 1
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    profiles: ["migration"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ./private-alpha.env
    working_dir: /app/packages/db
    command: ["./node_modules/.bin/drizzle-kit", "migrate"]
    restart: "no"
