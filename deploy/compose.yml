# Self-hosted Orchestrat: the server (API + dashboard) and Postgres.
#
#   cd deploy
#   docker compose run --rm --no-deps -T orchestrat init > .env
#   docker compose up -d
#   docker compose logs orchestrat   # open the setup link it prints
#
# Attachments need object storage: add compose.storage.yml, e.g.
#   docker compose -f compose.yml -f compose.storage.yml up -d
name: orchestrat

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: orchestrat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orchestrat
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrat -d orchestrat"]
      interval: 5s
      timeout: 5s
      retries: 20

  orchestrat:
    image: ghcr.io/armanghev/orchestrat:${ORCHESTRAT_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ${ORCHESTRAT_ENV_FILE:-.env}
        required: false
    environment:
      ORCHESTRAT_DATABASE_URL: postgresql://orchestrat:${POSTGRES_PASSWORD}@postgres:5432/orchestrat
    ports:
      - "${ORCHESTRAT_PORT:-8801}:8801"

volumes:
  postgres:
